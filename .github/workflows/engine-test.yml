name: Engine CI & Elo Testing

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          path: pr-branch

      - name: Checkout Master Branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-branch

      - name: Build PR and Master Binaries
        run: |
          mkdir -p binaries

          cmake -S pr-branch -B pr-branch/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build pr-branch/build --config Release -j 2
          cp pr-branch/build/ciorap-bot-03 binaries/ciorap-bot-pr

          cmake -S master-branch -B master-branch/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build master-branch/build --config Release -j 2
          cp master-branch/build/ciorap-bot-03 binaries/ciorap-bot-master

          chmod +x binaries/ciorap-bot-pr binaries/ciorap-bot-master

      - name: Run Sanity Checks (Perft & Depth 10 Search)
        run: |
          {
            echo "uci"
            echo "isready"
            echo "ucinewgame"
            echo "position startpos"
            echo "go perft 5"
            sleep 2
            echo "go depth 10"
            sleep 5
            echo "quit"
          } | ./binaries/ciorap-bot-pr > sanity_output.txt

          grep -q "nodes 4865609" sanity_output.txt
          grep -q "bestmove" sanity_output.txt

      - name: Download Fastchess and Opening Book
        run: |
          wget -q https://github.com/Disservin/fastchess/releases/latest/download/fastchess-linux-x86-64.tar
          tar -xf fastchess-linux-x86-64.tar
          if [ -f fastchess-linux-x86-64/fastchess ]; then
            mv fastchess-linux-x86-64/fastchess ./fastchess
          fi
          chmod +x ./fastchess

          curl -sfL https://raw.githubusercontent.com/official-stockfish/books/master/2moves_v1.pgn -o 2moves_v1.pgn || \
          (curl -sfL https://raw.githubusercontent.com/official-stockfish/books/master/2moves_v2.pgn.zip -o 2moves_v2.pgn.zip && unzip -p 2moves_v2.pgn.zip > 2moves_v1.pgn)

      - name: Run Fastchess Match (PR-Branch vs Master)
        run: |
          ./fastchess \
            -engine cmd=binaries/ciorap-bot-pr name=PR-Branch \
            -engine cmd=binaries/ciorap-bot-master name=Master \
            -each tc=1+0.1 \
            -openings file=2moves_v1.pgn format=pgn order=random \
            -rounds 500 \
            -repeat \
            -concurrency 2 \
            -ratinginterval 100 \
            -log level=err \
            -pgnout file=match_results.pgn min=true

      - name: Upload Match Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-results
          path: match_results.pgn

